name: SonarQube Analysis - Go

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests with coverage (si existen tests)
        run: go test ./... -coverprofile=coverage.out
        continue-on-error: true  # no truena el pipeline si no hay tests aún

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=g9-kuntur
            -Dsonar.projectName=g9-kuntur
            -Dsonar.sources=.
            -Dsonar.exclusions=**/vendor/**
            -Dsonar.go.coverage.reportPaths=coverage.out

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}